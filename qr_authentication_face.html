    <script>
        // ฟังก์ชันตรวจสอบ IP Address กับฐานข้อมูล
        async function verifyIPAccess(roomId, detectedIP) {
            try {
                console.log('🔍 Verifying IP access for room:', roomId, 'IP:', detectedIP);
                
                // วิธีที่ 1: หาข้อมูลห้องสอบก่อน
                console.log('🔍 Method 1: Getting exam room data...');
                const { data: roomData, error: roomError } = await SupabaseAuth.supabase
                    .from('exam_rooms')
                    .select('*')
                    .eq('id', roomId)
                    .single();
                
                console.log('🏢 Exam room data:', roomData);
                
                if (!roomError && roomData) {
                    // วิธีที่ 2: หา layout_id จาก room_name
                    console.log('🔍 Method 2: Finding layout by room_name:', roomData.room_name);
                    const { data: layouts, error: layoutError } = await SupabaseAuth.supabase
                        .from('room_seat_layouts')
                        .select('id, room_name')
                        .eq('room_name', roomData.room_name);
                    
                    console.log('🏗️ Found layouts:', layouts);
                    
                    if (!layoutError && layouts && layouts.length > 0) {
                        const layoutId = layouts[0].id;
                        console.log('✅ Found layout_id:', layoutId, 'for room:', roomData.room_name);
                        
                        // วิธีที่ 3: ดึง IP mappings จาก layout_id
                        console.log('🔍 Method 3: Getting IP mappings for layout_id:', layoutId);
                        const { data: allowedIPs, error: ipError } = await SupabaseAuth.supabase
                            .from('room_seat_ip_mappings')
                            .select('ip_address, seat_number, row_number, column_number')
                            .eq('layout_id', layoutId);
                        
                        console.log('📋 Found IP mappings:', allowedIPs);
                        
                        if (!ipError && allowedIPs && allowedIPs.length > 0) {
                            return checkIPMatch(allowedIPs, detectedIP);
                        } else {
                            console.log('❌ No IP mappings found for layout_id:', layoutId);
                        }
                    } else {
                        console.log('❌ No layout found for room_name:', roomData.room_name);
                    }
                    
                    // วิธีที่ 4: ลองใช้ layout_id ตรงๆ ถ้ามีใน exam_rooms
                    if (roomData.layout_id) {
                        console.log('🔍 Method 4: Trying direct layout_id from exam_rooms:', roomData.layout_id);
                        const { data: allowedIPs, error: ipError } = await SupabaseAuth.supabase
                            .from('room_seat_ip_mappings')
                            .select('ip_address, seat_number, row_number, column_number')
                            .eq('layout_id', roomData.layout_id);
                        
                        if (!ipError && allowedIPs && allowedIPs.length > 0) {
                            return checkIPMatch(allowedIPs, detectedIP);
                        }
                    }
                }
                
                // วิธีที่ 4: Fallback - ปฏิเสธการเข้าถึงเมื่อไม่พบข้อมูล
                console.log('❌ No IP mapping found, access DENIED');
                return false;
                
            } catch (error) {
                console.error('❌ Error in IP verification:', error);
                // ปฏิเสธการเข้าถึงเมื่อเกิดข้อผิดพลาด (เพื่อความปลอดภัย)
                return false;
            }
        }

        // ฟังก์ชันตรวจสอบ IP ที่แยกออกมา
        function checkIPMatch(allowedIPs, detectedIP) {
            console.log('📋 Allowed IPs:', allowedIPs);
            console.log('🎯 Looking for IP:', detectedIP);
            
            let isAllowed = false;
            let matchedSeat = null;
            
            if (allowedIPs && allowedIPs.length > 0) {
                const match = allowedIPs.find(row => row.ip_address === detectedIP);
                if (match) {
                    isAllowed = true;
                    matchedSeat = match.seat_number;
                    console.log('✅ IP match found! Seat:', matchedSeat);
                } else {
                    console.log('❌ IP not found in allowed list');
                    console.log('📊 Comparison details:');
                    allowedIPs.forEach((row, index) => {
                        console.log(`   ${index + 1}. Database IP: "${row.ip_address}" vs Detected IP: "${detectedIP}" | Match: ${row.ip_address === detectedIP}`);
                    });
                }
            } else {
                console.log('⚠️ No IP mappings found');
            }
            
            console.log('🎯 Final IP verification result:', isAllowed, matchedSeat ? `(Seat: ${matchedSeat})` : '');
            return isAllowed;
        }

        // ฟังก์ชันดึง IP Address ของผู้ใช้ (เฉพาะ Primary Wi-Fi IP)
        async function getCurrentUserIP() {
            try {
                console.log('🌐 Starting Primary Wi-Fi IP detection...');
                
                // ใช้เฉพาะ WebRTC เพื่อหา Primary Local IP จาก Wi-Fi adapter
                const primaryIP = await getPrimaryWiFiIP();
                if (primaryIP && isValidWiFiIP(primaryIP)) {
                    console.log('✅ Found Primary Wi-Fi IP:', primaryIP);
                    return primaryIP;
                }
                
                console.error('❌ Could not determine Primary Wi-Fi IP');
                return null;
                
            } catch (error) {
                console.error('❌ Error in getCurrentUserIP:', error);
                return null;
            }
        }

        // ฟังก์ชันดึง Primary Wi-Fi IP ผ่าน WebRTC (เฉพาะ 10.110.x.x range)
        function getPrimaryWiFiIP() {
            console.log('🚀 getPrimaryWiFiIP() called - Starting WebRTC IP detection...');
            return new Promise((resolve) => {
                try {
                    const pc = new RTCPeerConnection({
                        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                    });
                    
                    let resolved = false;
                    let candidateIPs = [];
                    
                    pc.createDataChannel('test');
                    console.log('📡 WebRTC DataChannel created');
                    
                    pc.onicecandidate = (event) => {
                        console.log('🔄 ICE candidate event triggered');
                        if (event.candidate && !resolved) {
                            const candidate = event.candidate.candidate;
                            console.log('🔍 WebRTC candidate:', candidate);
                            
                            // หา IP จาก candidate
                            const ipMatch = candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                            
                            if (ipMatch) {
                                const ip = ipMatch[0];
                                console.log('🔍 WebRTC candidate IP found:', ip);
                                
                                // เก็บ IP ทั้งหมดที่พบ
                                if (!candidateIPs.includes(ip)) {
                                    candidateIPs.push(ip);
                                    console.log('📝 Added IP to candidates list:', ip, '| Total candidates:', candidateIPs.length);
                                }
                                
                                // ตรวจสอบว่าเป็น KMUTNB network หรือไม่
                                if (ip.startsWith('10.110.')) {
                                    console.log('🎯 KMUTNB network IP found immediately:', ip);
                                    resolved = true;
                                    pc.close();
                                    resolve(ip);
                                    return;
                                }
                                
                                // ให้ความสำคัญกับ IP ที่อยู่ในช่วง valid WiFi
                                if (isValidWiFiIP(ip) && !resolved) {
                                    console.log('✅ Valid WiFi IP found:', ip);
                                    // ไม่ resolve ทันที เพื่อรอ KMUTNB network ก่อน
                                }
                            }
                        }
                    };
                    
                    pc.createOffer().then(offer => {
                        console.log('📋 WebRTC offer created');
                        return pc.setLocalDescription(offer);
                    }).then(() => {
                        console.log('🔧 Local description set');
                    });
                    
                    // Timeout หลัง 8 วินาที - ให้เวลามากขึ้นเพื่อรวบรวม candidates
                    setTimeout(() => {
                        console.log('⏰ Timeout reached, resolving with best available IP...');
                        if (!resolved) {
                            resolved = true;
                            pc.close();
                            
                            console.log('🔍 All candidate IPs found:', candidateIPs);
                            
                            // หา IP ที่ดีที่สุดจาก candidates ที่รวบรวมได้
                            const bestIP = findBestWiFiIP(candidateIPs);
                            console.log('🏆 Best IP selected:', bestIP);
                            resolve(bestIP);
                        }
                    }, 8000);
                    
                } catch (error) {
                    console.error('❌ WebRTC IP detection failed:', error);
                    resolve(null);
                }
            });
        }
        
        // ฟังก์ชันหา IP ที่ดีที่สุดจาก candidates
        function findBestWiFiIP(candidateIPs) {
            // ลำดับความสำคัญ:
            // 1. 10.110.x.x (KMUTNB network)
            // 2. 192.168.x.x (Home/Office WiFi)
            // 3. 10.x.x.x (Private network)
            // 4. 172.16-31.x.x (Private network)
            
            for (const ip of candidateIPs) {
                if (ip.startsWith('10.110.')) {
                    console.log('✅ Found KMUTNB network IP:', ip);
                    return ip;
                }
            }
            
            for (const ip of candidateIPs) {
                if (ip.startsWith('192.168.')) {
                    console.log('✅ Found WiFi network IP:', ip);
                    return ip;
                }
            }
            
            for (const ip of candidateIPs) {
                if (ip.startsWith('10.') && !ip.startsWith('10.110.')) {
                    console.log('✅ Found private network IP:', ip);
                    return ip;
                }
            }
            
            for (const ip of candidateIPs) {
                const parts = ip.split('.');
                if (parts[0] === '172' && parseInt(parts[1]) >= 16 && parseInt(parts[1]) <= 31) {
                    console.log('✅ Found private network IP:', ip);
                    return ip;
                }
            }
            
            console.warn('❌ No suitable WiFi IP found in candidates');
            return null;
        }
        
        // ฟังก์ชันตรวจสอบว่า IP เป็น Valid Wi-Fi IP หรือไม่
        function isValidWiFiIP(ip) {
            if (!ip) return false;
            
            // ให้ความสำคัญสูงสุดกับ KMUTNB network (10.110.x.x)
            if (ip.startsWith('10.110.')) {
                console.log('🎯 KMUTNB network IP detected:', ip);
                return true;
            }
            
            // รองรับ WiFi networks อื่นๆ
            if (ip.startsWith('192.168.')) {
                console.log('📶 WiFi network IP detected:', ip);
                return true;
            }
            
            // รองรับ private networks
            if (ip.startsWith('10.')) {
                console.log('🏠 Private network IP detected:', ip);
                return true;
            }
            
            // รองรับ private networks (172.16-31.x.x)
            const parts = ip.split('.');
            if (parts[0] === '172' && parseInt(parts[1]) >= 16 && parseInt(parts[1]) <= 31) {
                console.log('🏢 Corporate network IP detected:', ip);
                return true;
            }
            
            console.log('❌ Invalid or non-WiFi IP:', ip);
            return false;
        }

        // ฟังก์ชันตรวจสอบว่าเป็น Local IP หรือไม่
        function isLocalIP(ip) {
            if (!ip) return false;
            
            const parts = ip.split('.').map(Number);
            
            // ตรวจสอบ Private IP ranges
            return (
                // 10.0.0.0 - 10.255.255.255
                (parts[0] === 10) ||
                // 172.16.0.0 - 172.31.255.255
                (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) ||
                // 192.168.0.0 - 192.168.255.255
                (parts[0] === 192 && parts[1] === 168)
            );
        }

    <script>
        // Global variables for face recognition
        let modelsLoaded = false;
        let storedDescriptors = []; // array of {label, descriptor}
        const photoTypes = [
            { key: 'closed_eye', label: 'ตาปิด' },
            { key: 'open_eye', label: 'ตาเปิด' },
            { key: 'turn_left', label: 'หันซ้าย' },
            { key: 'turn_right', label: 'หันขวา' },
            { key: 'look_up', label: 'มองขึ้น' },

        // Simple face detection variables
        let faceDetectionActive = true;
        let isProcessing = false;

        // Load face recognition models with memory optimization
        async function loadModels() {
            try {
                console.log('Loading face recognition models...');
                
                // Load models sequentially to reduce memory pressure
                await faceapi.nets.tinyFaceDetector.loadFromUri('/student/models');
                await faceapi.nets.faceLandmark68Net.loadFromUri('/student/models');
                await faceapi.nets.faceRecognitionNet.loadFromUri('/student/models');
                
                modelsLoaded = true;
                console.log('Models loaded successfully');
            } catch (error) {
                console.error('Error loading models:', error);
            }
        }

        // Function to compute descriptors for stored photos
        async function computeStoredDescriptors() {
            if (!modelsLoaded) {
                console.log('Models not loaded yet');
                return;
            }
            try {
                console.log('Starting to compute stored descriptors...');
                
                // Get user_id from URL parameter instead of getCurrentUserAsync
                const urlParams = new URLSearchParams(window.location.search);
                const userId = urlParams.get('user_id');
                console.log('User ID from URL:', userId);
                
                if (!userId) {
                    console.log('No user ID found in URL parameters');
                    return;
                }
                
                console.log('Querying user_photos table with user_id:', userId);
                const { data: photosArray, error } = await window.SupabaseAuth.supabase
                    .from('user_photos')
                    .select('*')
                    .eq('user_id', userId)
                    .order('created_at', { ascending: false })
                    .limit(1);
                
                console.log('Photos query result:', { photosArray, error });
                
                if (error) {
                    console.error('Error fetching photos:', error);
                    return;
                }

                if (!photosArray || photosArray.length === 0) {
                    console.log('No photos found for user ID:', userId);
                    return;
                }

                const photos = photosArray[0];
                console.log('Photos data:', photos);
                storedDescriptors = [];
                
                for (const type of photoTypes) {
                    const photoUrl = photos[type.key];
                    console.log('Processing type:', type.label, 'URL:', photoUrl);
                    if (photoUrl) {
                        try {
                            // Add cache busting to prevent loading old images
                            const cacheBuster = new Date().getTime();
                            const finalPhotoUrl = photoUrl.includes('?') 
                                ? `${photoUrl}&t=${cacheBuster}` 
                                : `${photoUrl}?t=${cacheBuster}`;
                            
                            const img = await faceapi.fetchImage(finalPhotoUrl);
                            console.log('Image loaded successfully for', type.label);
                            console.log('Image dimensions:', img.width, 'x', img.height);
                            
                            // Try multiple detection methods for better accuracy (using only loaded models)
                            const detectionOptions = [
                                // Method 1: Tiny Face Detector (high quality)
                                () => faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.3 })).withFaceLandmarks().withFaceDescriptors(),
                                // Method 2: Tiny Face Detector (medium quality)
                                () => faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.3 })).withFaceLandmarks().withFaceDescriptors(),
                                // Method 3: Tiny Face Detector (lower threshold)
                                () => faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.1 })).withFaceLandmarks().withFaceDescriptors()
                            ];
                            
                            let detections = null;
                            let methodUsed = 0;
                            
                            // Try different detection methods
                            for (let i = 0; i < detectionOptions.length; i++) {
                                try {
                                    detections = await detectionOptions[i]();
                                    if (detections && detections.length > 0) {
                                        methodUsed = i + 1;
                                        break;
                                    }
                                } catch (detectionError) {
                                    console.log(`Detection method ${i + 1} failed for ${type.label}:`, detectionError.message);
                                }
                            }
                            
                            console.log('Detections for', type.label, ':', detections ? detections.length : 0, 'using method', methodUsed);
                            
                            if (detections && detections.length > 0) {
                                // Use the best detection (highest confidence)
                                let bestDetection = detections[0];
                                if (detections.length > 1) {
                                    bestDetection = detections.reduce((best, current) => 
                                        current.detection.score > best.detection.score ? current : best
                                    );
                                }
                                
                                storedDescriptors.push({
                                    label: type.label,
                                    descriptor: bestDetection.descriptor,
                                    confidence: bestDetection.detection.score
                                });
                                console.log('Descriptor added for', type.label, 'with confidence:', bestDetection.detection.score);
                            } else {
                                console.log('No faces detected in', type.label, '- trying image preprocessing...');
                                
                                // Try preprocessing the image
                                try {
                                    const canvas = document.createElement('canvas');
                                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                                    canvas.width = img.width;
                                    canvas.height = img.height;
                                    
                                    // Draw with enhanced contrast
                                    ctx.filter = 'contrast(1.5) brightness(1.2)';
                                    ctx.drawImage(img, 0, 0);
                                    
                                    const enhancedDetections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.1 })).withFaceLandmarks().withFaceDescriptors();
                                    
                                    if (enhancedDetections && enhancedDetections.length > 0) {
                                        storedDescriptors.push({
                                            label: type.label,
                                            descriptor: enhancedDetections[0].descriptor,
                                            confidence: enhancedDetections[0].detection.score,
                                            enhanced: true
                                        });
                                        console.log('Descriptor added for', type.label, 'after enhancement with confidence:', enhancedDetections[0].detection.score);
                                    } else {
                                        console.log('Still no faces detected in', type.label, 'after enhancement');
                                    }
                                } catch (enhanceError) {
                                    console.log('Image enhancement failed for', type.label, ':', enhanceError.message);
                                }
                            }
                        } catch (fetchError) {
                            console.error('Error fetching image for', type.label, fetchError);
                        }
                    } else {
                        console.log('No photo URL for', type.label);
                    }
                }
                console.log('Stored descriptors computed:', storedDescriptors.length);
                
                // Update UI to show detection status
                updateDetectionStatus();
                
            } catch (error) {
                console.error('Error computing stored descriptors:', error);
            }
        }
        
        // Function to update detection status in UI
        function updateDetectionStatus() {
            const statusDiv = document.getElementById('identification-status');
            if (storedDescriptors.length === 0) {
                statusDiv.textContent = 'ไม่พบใบหน้าในรูปอ้างอิง - กรุณาลงทะเบียนใบหน้าใหม่';

        }

        // Simple face matching function
        function isRealFace(detection) {
            // Simple check - if we can detect face landmarks, assume it's real
            return detection && detection.landmarks && detection.detection.score > 0.5;
        }

        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.querySelector('.output_canvas');
        const ctx = canvasElement.getContext('2d', { willReadFrequently: true });
        const statusDiv = document.getElementById('identification-status');

        // Global variable for detection interval
        let detectionInterval = null;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let detectionDelay = isMobile ? 300 : 150; // Slower on mobile for better performance

        // Camera setup with face recognition
        async function startCamera() {
            try {
                console.log('Starting camera initialization...');
                // Mobile-optimized video constraints
                const constraints = {
                    video: {
                        width: isMobile ? 320 : 640,
                        height: isMobile ? 240 : 480,
                        facingMode: 'user',
                        frameRate: isMobile ? 15 : 30 // Lower frame rate on mobile
                    }
                };
                
                console.log('Requesting camera access with constraints:', constraints);
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                console.log('Camera stream obtained successfully');
                
                videoElement.srcObject = stream;

        // Function to start detection loop with performance optimization
        function startDetection() {
            if (detectionInterval) {
                clearInterval(detectionInterval);
            }
            detectionInterval = setInterval(detectAndRecognize, detectionDelay);
        }

        // Simple face detection and recognition with performance optimization
        async function detectAndRecognize() {
            // Prevent overlapping processing
            if (isProcessing) {
                return;
            }
            
            if (!modelsLoaded || storedDescriptors.length === 0) {
                ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
                return;
            }
            
            isProcessing = true;
            
            try {
                const detections = await faceapi.detectAllFaces(videoElement, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.3 })).withFaceLandmarks().withFaceDescriptors();
                
                // Only redraw canvas when necessary
                if (detections.length > 0 || Math.random() < 0.1) { // Reduce canvas updates to 10% when no face
                    ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
                }
                // Skip drawing detection frames for cleaner display
                const resizedDetections = faceapi.resizeResults(detections, { width: canvasElement.width, height: canvasElement.height });
                // faceapi.draw.drawDetections(canvasElement, resizedDetections); // Commented out to remove blue frames

                if (detections.length > 0) {
                    const detection = detections[0];
                    
                    // Check if it's a real face (simple check)
                    const isReal = isRealFace(detection);
                    
                    // Additional validation: Check if face is properly detected and has valid descriptor
                    if (!detection.descriptor || !isReal) {
                        // Face not properly detected, show searching status
                        statusDiv.innerHTML = `
                            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                                <i class="fas fa-search" style="color: #6c757d; font-size: 1.2em;"></i>
                                <div>
                                    <div style="font-weight: 600;">🔍 กำลังค้นหาใบหน้า...</div>
                                    <div style="font-size: 0.85em; margin-top: 2px; opacity: 0.8;">
                                        กรุณาอยู่ในกรอบกล้องและหันหน้าตรง
                                    </div>
                                </div>
                            </div>
                        `;
                        statusDiv.style.color = '#495057';
                        statusDiv.style.background = '#f8f9fa';
                        statusDiv.style.border = '2px solid #dee2e6';
                        return;
                    }
                    
                    // Face recognition
                    const descriptor = detection.descriptor;
                    let bestMatch = null;
                    let minDistance = Infinity;

                    // Calculate distances to all stored descriptors
                    let allDistances = [];
                    for (const stored of storedDescriptors) {
                        const distance = faceapi.euclideanDistance(descriptor, stored.descriptor);
                        allDistances.push({ distance, label: stored.label });
                        if (distance < minDistance) {
                            minDistance = distance;
                            bestMatch = stored;
                        }
                    }

                    const threshold = 0.45; // Moderate threshold for balanced accuracy
                    
                    // Simplified validation
                    const isRecognized = bestMatch && minDistance < threshold;
                    const confidence = Math.round((1 - minDistance) * 100);
                            
                    // Debug information
                    console.log('Face detection results:');
                    console.log('- Distance to best match:', minDistance.toFixed(3));
                    console.log('- Threshold:', threshold);
                    console.log('- Is recognized:', isRecognized);
                    console.log('- Confidence:', confidence + '%');
                    if (bestMatch) {
                        console.log('- Best match label:', bestMatch.label);
                    }
                    
                    // Enhanced status update with better differentiation
                    if (isRecognized && isReal) {
                        statusDiv.innerHTML = `
                            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                                <i class="fas fa-check-circle" style="color: #28a745; font-size: 1.2em;"></i>
                                <div>
                                    <div style="font-weight: 600;">✅ ระบุตัวตนสำเร็จ - เจ้าของบัญชี</div>
                                    <div style="font-size: 0.85em; margin-top: 2px; opacity: 0.8;">
                                        ความแม่นยำ: ${confidence}% | ระยะห่าง: ${minDistance.toFixed(3)}
                                    </div>
                                </div>
                            </div>
                        `;
                        statusDiv.style.color = '#155724';
                        statusDiv.style.background = '#d4edda';
                        statusDiv.style.border = '2px solid #c3e6cb';
                        
                        // Face recognition successful - stop detection
                        console.log('Face recognized successfully!');
                        clearInterval(detectionInterval);
                        
                        // Get parameters for authentication data
                        const urlParams = new URLSearchParams(window.location.search);
                        const action = urlParams.get('action');
                        let roomId = urlParams.get('roomId') || sessionStorage.getItem('pendingExamRoomId');
                        
                        // ถ้าไม่มี roomId ให้ดึงจากฐานข้อมูล exam_rooms
                        if (!roomId || roomId.trim() === '') {
                            console.log('🔍 No roomId found, fetching from exam_rooms table...');
                            try {
                                const { data: examRooms, error: roomError } = await SupabaseAuth.supabase
                                    .from('exam_rooms')
                                    .select('id, room_name')
                                    .eq('is_active', true)
                                    .limit(1);

                                if (roomError) {
                                    console.error('Error fetching exam rooms:', roomError);
                                } else if (examRooms && examRooms.length > 0) {
                                    roomId = examRooms[0].id;
                                    console.log('✅ Found active exam room:', examRooms[0].room_name, 'ID:', roomId);
                                } else {
                                    console.warn('⚠️ No active exam rooms found');
                                }
                            } catch (error) {
                                console.error('Error querying exam_rooms:', error);
                            }
                        }
                        
                        // Show success message without redirection
                        statusDiv.innerHTML = `
                            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                                <i class="fas fa-check-circle" style="color: #28a745; font-size: 1.2em;"></i>
                                <div>
                                    <div style="font-weight: 600;">✅ ยืนยันตัวตนสำเร็จ</div>
                                    <div style="font-size: 0.85em; margin-top: 2px; opacity: 0.8;">
                                        ความแม่นยำ: ${confidence}%
                                    </div>
                                </div>
                            </div>
                        `;
                        
                        // Store authentication success data for other systems to use
                        if (roomId) {
                            sessionStorage.setItem('examRoomId', roomId);
                            sessionStorage.setItem('faceAuthSuccess', 'true');
                            
                            // Notify the main web page and save to database
                            console.log('🔄 Calling notifyWebPageAuthSuccess with roomId:', roomId);
                            notifyWebPageAuthSuccess(roomId);
                        } else {
                            console.warn('⚠️ No roomId available, cannot save authentication data');
                        }
                    } else if (!isRecognized && isReal) {
                        // Show more detailed info for non-matching faces
                        const similarityPercent = Math.round((1 - minDistance) * 100);
                        let statusText = '';
                        
                        if (minDistance < 0.5) {
                            statusText = `❌ ไม่ใช่เจ้าของบัญชี - แต่ใบหน้าคล้ายกันมาก ${similarityPercent}%`;
                        } else if (minDistance < 0.7) {
                            statusText = `❌ ไม่ใช่เจ้าของบัญชี - ใบหน้าต่างกันปานกลาง ${similarityPercent}%`;
                        } else {
                            statusText = `❌ ไม่ใช่เจ้าของบัญชี - ใบหน้าต่างกันมาก ${similarityPercent}%`;
                        }
                        
                        statusDiv.innerHTML = `
                            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                                <i class="fas fa-user-times" style="color: #dc3545; font-size: 1.2em;"></i>
                                <div>
                                    <div style="font-weight: 600;">${statusText}</div>
                                    <div style="font-size: 0.85em; margin-top: 2px; opacity: 0.8;">
                                        ระยะห่าง: ${minDistance.toFixed(3)} | เกณฑ์: ${threshold}
                                    </div>
                                </div>
                            </div>
                        `;
                        statusDiv.style.color = '#721c24';
                        statusDiv.style.background = '#f8d7da';
                        statusDiv.style.border = '2px solid #f5c6cb';
                    } else if (isRecognized && !isReal) {
                        statusDiv.innerHTML = `
                            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                                <i class="fas fa-exclamation-triangle" style="color: #ffc107; font-size: 1.2em;"></i>
                                <div>
                                    <div style="font-weight: 600;">⚠️ ตรวจพบใบหน้าที่ตรงกัน</div>
                                    <div style="font-size: 0.85em; margin-top: 2px; opacity: 0.8;">
                                        แต่คุณภาพการตรวจจับไม่เพียงพอ (${confidence}%)
                                    </div>
                                </div>
                            </div>
                        `;
                        statusDiv.style.color = '#856404';
                        statusDiv.style.background = '#fff3cd';
                        statusDiv.style.border = '2px solid #ffeaa7';
                    } else {
                        statusDiv.innerHTML = `
                            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                                <i class="fas fa-search" style="color: #6c757d; font-size: 1.2em;"></i>
                                <div>
                                    <div style="font-weight: 600;">🔍 กำลังวิเคราะห์ใบหน้า...</div>
                                    <div style="font-size: 0.85em; margin-top: 2px; opacity: 0.8;">
                                        ${bestMatch ? `คล้ายกับ: ${bestMatch.label} (${Math.round((1-minDistance)*100)}%)` : 'กรุณาอยู่ในกรอบกล้อง'}
                                    </div>
                                </div>
                            </div>
                        `;
                        statusDiv.style.color = '#495057';
                        statusDiv.style.background = '#f8f9fa';
                        statusDiv.style.border = '2px solid #dee2e6';
                    }

                } else {
                    statusDiv.innerHTML = `
                        <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                            <i class="fas fa-camera" style="color: #6c757d; font-size: 1.2em;"></i>
                            <div>
                                <div style="font-weight: 600;">📷 ไม่พบใบหน้า</div>
                                <div style="font-size: 0.85em; margin-top: 2px; opacity: 0.8;">กรุณาอยู่ในกรอบกล้อง</div>
                            </div>
                        </div>
                    `;
                    statusDiv.style.color = '#6c757d';
                    statusDiv.style.background = '#f8f9fa';
                    statusDiv.style.border = '2px solid #dee2e6';
                }
            } catch (error) {
                console.error('Error in detection:', error);
                ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
            } finally {
                isProcessing = false;
            }
        }

        // ฟังก์ชันส่งสัญญาณกลับไปยังหน้าเว็บ และบันทึกข้อมูลลง Supabase
        async function notifyWebPageAuthSuccess(roomId) {
            try {
                console.log('🚀 notifyWebPageAuthSuccess called with roomId:', roomId);
                
                // ดึง user_id จาก URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                const userId = urlParams.get('user_id');
                
                console.log('📋 URL Parameters:');
                console.log('  - userId:', userId);
                console.log('  - roomId:', roomId);
                
                if (!userId) {
                    console.warn('⚠️ Missing user_id in URL parameters');
                    console.log('Current URL:', window.location.href);
                    return;
                }

                // ตรวจสอบการเชื่อมต่อ Supabase
                console.log('🔍 Checking Supabase connection...');
                if (!SupabaseAuth || !SupabaseAuth.supabase) {
                    console.error('❌ SupabaseAuth or supabase client not available');
                    console.log('SupabaseAuth object:', SupabaseAuth);
                    showNotificationMessage('❌ ไม่สามารถเชื่อมต่อ Supabase ได้');
                    return;
                }
                console.log('✅ Supabase client is available');
                console.log('Supabase URL:', SupabaseAuth.supabase.supabaseUrl);

                // ตรวจสอบ authentication status
                console.log('👤 Checking authentication status...');
                const { data: { user }, error: authError } = await SupabaseAuth.supabase.auth.getUser();
                console.log('Current authenticated user:', user ? user.id : 'No user');
                if (authError) {
                    console.error('❌ Auth error:', authError);
                }

                // สำหรับ QR Authentication ไม่จำเป็นต้องมี authenticated user
                // เพราะเป็นการยืนยันตัวตนผ่าน Face Recognition แทน
                // ดังนั้นเราจะใช้ service role หรือ bypass RLS policy
                console.log('🔓 Using anonymous access for QR authentication...');

                // ดึง IP Address จาก URL parameter
                console.log('🌐 Getting IP address from URL parameter...');
                const ipFromUrl = urlParams.get('ip');
                console.log('📍 IP from URL:', ipFromUrl);
                
                // ใช้ IP จาก URL parameter หรือจาก window.qrCodeIP หรือ fallback ไปยังการตรวจจับ IP
                let userIP = ipFromUrl || window.qrCodeIP;
                if (!userIP) {
                    console.log('⚠️ No IP in URL parameter or window.qrCodeIP, detecting IP address...');
                    userIP = await getCurrentUserIP();
                    console.log('📍 Detected IP:', userIP);
                }
                
                if (!userIP) {
                    console.error('❌ Could not get user IP address');
                    showNotificationMessage('❌ ไม่สามารถรับ IP Address ได้');
                    return;
                }
                
                console.log('✅ Using IP address:', userIP);

                console.log('📱 Preparing to save authentication data to Supabase...');
                console.log('📊 Data summary:');
                console.log('  - User ID:', userId);
                console.log('  - IP Address:', userIP);
                console.log('  - Room ID:', roomId);

                // บันทึกข้อมูลการยืนยันตัวตนลง Supabase (ใช้โครงสร้างตารางจริง)
                const authData = {
                    user_id: userId,
                    ip: userIP, // ใช้ ip ตามโครงสร้างตารางจริง
                    status: 'authenticated',
                    authenticated_at: new Date().toISOString(),
                    expires_at: new Date(Date.now() + 60 * 60 * 1000).toISOString() // หมดอายุใน 1 ชั่วโมง
                };

                console.log('📝 Auth data to insert:', JSON.stringify(authData, null, 2));

                // ทดสอบการเชื่อมต่อกับตาราง qr_authentication ก่อน
                console.log('🔍 Testing table access...');
                try {
                    const { data: testData, error: testError } = await SupabaseAuth.supabase
                        .from('qr_authentication')
                        .select('id')
                        .limit(1);
                    
                    if (testError) {
                        console.error('❌ Table access test failed:', testError);
                        console.error('Error details:', {
                            message: testError.message,
                            details: testError.details,
                            hint: testError.hint,
                            code: testError.code
                        });
                        showNotificationMessage('❌ ไม่สามารถเข้าถึงตาราง qr_authentication ได้: ' + testError.message);
                        return;
                    }
                    console.log('✅ Table access test successful');
                } catch (tableError) {
                    console.error('❌ Exception during table access test:', tableError);
                    showNotificationMessage('❌ เกิดข้อผิดพลาดในการทดสอบการเข้าถึงตาราง');
                    return;
                }

                console.log('💾 Attempting to replace existing data (delete + insert)...');
                
                // First, delete existing records for this user_id
                console.log('🗑️ Deleting existing records...');
                console.log('🔍 Delete criteria:');
                console.log('  - user_id:', userId, '(type:', typeof userId, ')');
                
                const { data: deleteResult, error: deleteError } = await SupabaseAuth.supabase
                    .from('qr_authentication')
                    .delete()
                    .eq('user_id', userId)
                    .select();

                if (deleteError) {
                    console.warn('⚠️ Warning during delete (may be normal if no existing records):', deleteError);
                } else {
                    console.log('✅ Delete operation completed');
                    console.log('🗑️ Deleted records:', deleteResult);
                    console.log('📊 Number of deleted records:', deleteResult ? deleteResult.length : 0);
                }

                // Then insert the new record
                console.log('➕ Inserting new record...');
                const { data: insertResult, error: insertError } = await SupabaseAuth.supabase
                    .from('qr_authentication')
                    .insert([authData])
                    .select();

                if (insertError) {
                    console.error('❌ Error saving to Supabase:', insertError);
                    console.error('Insert error details:', {
                        message: insertError.message,
                        details: insertError.details,
                        hint: insertError.hint,
                        code: insertError.code
                    });
                    showNotificationMessage('❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + insertError.message);
                    
                    // Fallback to localStorage for backward compatibility
                    const authSession = {
                        user_id: userId,
                        status: 'authenticated',
                        room_id: roomId,
                        ip: userIP,
                        authenticated_at: new Date().toISOString(),
                        error: insertError.message
                    };
                    localStorage.setItem('authenticationSession', JSON.stringify(authSession));
                    console.log('📝 Fallback: Saved to localStorage with error info');
                    return;
                }

                console.log('✅ Successfully saved authentication data to Supabase!');
                console.log('📊 Insert result:', insertResult);
                
                // แสดงข้อความแจ้งเตือน
                showNotificationMessage('✅ บันทึกข้อมูลการยืนยันตัวตนสำเร็จ');
                
                // ยังคงบันทึกลง localStorage เพื่อ backward compatibility
                const authSession = {
                    user_id: userId,
                    status: 'authenticated',
                    room_id: roomId,
                    ip: userIP,
                    authenticated_at: new Date().toISOString(),
                    supabase_saved: true,
                    supabase_id: insertResult[0]?.id
                };
                localStorage.setItem('authenticationSession', JSON.stringify(authSession));
                console.log('🔔 Notified web page of successful authentication');
                console.log('💾 Also saved to localStorage for backward compatibility');
                
            } catch (error) {
                console.error('❌ Exception in notifyWebPageAuthSuccess:', error);
                console.error('Error stack:', error.stack);
                showNotificationMessage('❌ เกิดข้อผิดพลาดในการส่งข้อมูล: ' + error.message);
                
                // Save error info to localStorage
                const urlParams = new URLSearchParams(window.location.search);
                const errorSession = {
                    session_id: urlParams.get('session_id'),
                    user_id: urlParams.get('user_id'),
                    status: 'error',
                    error: error.message,
                    error_at: new Date().toISOString()
                };
                localStorage.setItem('authenticationSession', JSON.stringify(errorSession));
            }
        }

        // แสดงข้อความแจ้งเตือน
        function showNotificationMessage(message) {
            const notificationDiv = document.createElement('div');
            notificationDiv.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: #28a745;
                color: white;
                padding: 15px 25px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                z-index: 10000;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                animation: slideDown 0.3s ease-out;
            `;
            
            // เพิ่ม CSS animation
            if (!document.getElementById('notification-styles')) {
                const style = document.createElement('style');
                style.id = 'notification-styles';
                style.textContent = `
                    @keyframes slideDown {
                        from { transform: translateX(-50%) translateY(-100%); opacity: 0; }
                        to { transform: translateX(-50%) translateY(0); opacity: 1; }
                    }
                `;
                document.head.appendChild(style);
            }
            
            notificationDiv.textContent = message;
            document.body.appendChild(notificationDiv);

            // ลบข้อความหลังจาก 3 วินาที
            setTimeout(() => {
                if (notificationDiv.parentNode) {
                    notificationDiv.style.animation = 'slideDown 0.3s ease-out reverse';
                    setTimeout(() => {
                        if (notificationDiv.parentNode) {
                            notificationDiv.parentNode.removeChild(notificationDiv);
                        }
                    }, 300);
                }
            }, 3000);
        }

        // Start everything when page loads
        window.addEventListener('load', async () => {
            await loadModels();
            await computeStoredDescriptors();
            startCamera();
        });
    </script>
